# 02 课避障参数。数值与代码中的默认值相同，列在这里方便查阅和修改。
#
# 运行中修改（立即生效，不合法的组合会被拒绝）：
#   ros2 param set /avoider max_linear_speed 0.15
# 修改本文件后重新 launch 即可（用 --symlink-install 编译时无需重新编译）。
#
# 距离阈值的关系：stop_distance < clear_distance，stop_distance < slow_distance
#
#   前方距离:  0 ─── stop(0.5) ───── clear(0.7) ─── slow(1.0) ─────▶
#   FORWARD:   │ 转向 │◀─── 线性减速 ──────────▶│ 全速 ─────────
#   TURNING:   │◀── 继续转（迟滞区）──▶│ 恢复前进

/**/avoider:
  ros__parameters:
    # ---- 速度 ----
    max_linear_speed: 0.20      # 前方开阔时的前进速度，m/s（TurtleBot3 waffle 上限约 0.26）
    min_linear_speed: 0.05      # 接近障碍时的最低前进速度，m/s
    turn_speed: 1.0             # 原地转向的角速度，rad/s（waffle 上限约 1.82）
    steer_gain: 2.0             # 前进时躲避侧方障碍的转向增益，(rad/s)/m

    # ---- 距离阈值 ----
    stop_distance: 0.50         # 前方小于此距离：停止前进，原地转向，m
    slow_distance: 1.00         # 前方小于此距离：开始减速，m
    clear_distance: 0.70        # 转向中前方大于此距离：恢复前进，m
    side_distance: 0.35         # 侧方小于此距离：前进中向另一侧偏转，m

    # ---- 扇区划分 ----
    front_half_angle_deg: 30.0  # 前方扇区半角，度
    side_angle_deg: 90.0        # 侧方扇区外边界，度

    # ---- 其他 ----
    max_turn_time: 6.0          # 同一方向转向超过此时间仍未脱困则换向，s
    scan_timeout: 0.5           # 雷达数据超过此时间未更新则停车，s
    control_rate_hz: 10.0       # 控制频率，Hz（只读，只能在启动时设置）
