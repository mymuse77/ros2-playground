# 05 课 · 巡逻航点（turtlebot3_world，04 课地图的 map 坐标系）
#
# map 坐标系的原点是建图开始时小车的位置，即 Gazebo 里的出生点 (-2.0, -0.5)：
#   Gazebo 坐标 = map 坐标 + (-2.0, -0.5)
# 9 根柱子在 map 坐标系中位于 x ∈ {0.9, 2.0, 3.1} × y ∈ {-0.6, 0.5, 1.6}。
#
# 航点选在离障碍物至少 0.5 m 的地方（用地图算过，见 05 课 README），
# 路线绕场地一圈，并从柱子之间穿过两次，最后回到出发点。
#
# 字段：name 名字（唯一）、x / y 位置（m）、yaw_deg 到达时车头朝向（度，0 = x 轴正方向，逆时针为正）
frame_id: map
waypoints:
  - {name: north,  x: 1.45, y: 2.40,  yaw_deg: 0}     # 上方柱子与围墙之间
  - {name: east,   x: 2.55, y: 1.05,  yaw_deg: -90}   # 右侧两列柱子之间
  - {name: south,  x: 2.55, y: -1.40, yaw_deg: 180}   # 下方柱子与围墙之间
  - {name: center, x: 1.45, y: -0.05, yaw_deg: 90}    # 左侧两列柱子之间
  - {name: home,   x: 0.00, y: 0.00,  yaw_deg: 0}     # 出发点
