[develop]
script_dir=$base/lib/pg_nav2_py
[install]
install_scripts=$base/lib/pg_nav2_py

# 代码风格检查配置（test/test_flake8.py 使用）。
# 与 ament_flake8 的默认配置相同，额外忽略 D400、D415：
# 这两条要求文档字符串的摘要以英文句点结尾，中文摘要无法满足。
[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,D400,D415
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
